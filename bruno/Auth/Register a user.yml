info:
  name: Register a user
  type: http
  seq: 2

http:
  method: POST
  url: https://localhost:8443/api/v1/auth/register
  body:
    type: json
    data: |-
      {
        "username": "Bernardusz",
        "password": "Bernardusz",
        "email": "bernardusz@gmail.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
