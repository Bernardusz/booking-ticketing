info:
  name: Get all Showings
  type: http
  seq: 2

http:
  method: GET
  url: https://localhost:8443/api/v1/showings
  params:
    - name: languageCode
      value: ENG-A
      type: query
      description: Language code of the showings
      disabled: true
    - name: startTime
      value: 2026-10-03T19:10:00Z
      type: query
      description: Must start after this time
      disabled: true
    - name: endTime
      value: 2026-10-03T20:30:00Z
      type: query
      description: The show must end before this time
      disabled: true
    - name: movieId
      value: "1"
      type: query
      description: Get all the showings of this movie
      disabled: true
    - name: auditoriumId
      value: "3"
      type: query
      description: Get all the showings from this Auditorium
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
