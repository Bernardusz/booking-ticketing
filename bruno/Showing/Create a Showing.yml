info:
  name: Create a Showing
  type: http
  seq: 1

http:
  method: POST
  url: https://localhost:8443/api/v1/showings
  body:
    type: json
    data: |-
      {
        "movieId": 1,
        "startTime": "2026-10-03T14:30:00Z",
        "languageCode": "ENG-A",
        "price": 12.50,
        "auditoriumId": 3
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
