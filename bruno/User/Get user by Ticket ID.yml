info:
  name: Get user by Ticket ID
  type: http
  seq: 7

http:
  method: GET
  url: https://localhost:8443/api/v1/users/ticket/:ticketId
  params:
    - name: ticketId
      value: "1"
      type: path
      description: Ticket ID owned by the searched user
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
