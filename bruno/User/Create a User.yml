info:
  name: Create a User
  type: http
  seq: 1

http:
  method: POST
  url: https://localhost:8443/api/v1/users
  body:
    type: json
    data: |-
      {
        "username": "Bernardus",
        "password": "Bernardus",
        "email": "bernardus@gmail.com",
        "role": "ROLE_USER"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
