info:
  name: Lock a Ticket
  type: http
  seq: 1

http:
  method: POST
  url: https://localhost:8443/api/v1/tickets/lock
  body:
    type: json
    data: |-
      {
        "ticketIds": [79,80]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
