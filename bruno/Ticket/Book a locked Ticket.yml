info:
  name: Book a locked Ticket
  type: http
  seq: 2

http:
  method: POST
  url: https://localhost:8443/api/v1/tickets/book
  body:
    type: json
    data: |-
      {
        "ticketIds": [79, 80]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
