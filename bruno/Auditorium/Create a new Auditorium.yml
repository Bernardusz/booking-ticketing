info:
  name: Create a new Auditorium
  type: http
  seq: 1

http:
  method: POST
  url: https://localhost:8443/api/v1/auditoriums
  body:
    type: json
    data: |-
      {
        "code": "AA1",
        "name": "Cinema AA1",
        "totalSeats": 98
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
