info:
  name: Get a Language
  type: http
  seq: 3

http:
  method: GET
  url: https://localhost:8443/api/v1/languages/:code
  params:
    - name: code
      value: ENG-A
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
