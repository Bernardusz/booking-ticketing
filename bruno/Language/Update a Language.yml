info:
  name: Update a Language
  type: http
  seq: 4

http:
  method: PUT
  url: https://localhost:8443/api/v1/languages/:code
  params:
    - name: code
      value: ENG
      type: path
  body:
    type: json
    data: |-
      {
        "title": "English America"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
