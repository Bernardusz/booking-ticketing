info:
  name: Create Language
  type: http
  seq: 1

http:
  method: POST
  url: https://localhost:8443/api/v1/languages
  body:
    type: json
    data: |-
      {
        "code": "ENG-A",
        "title": "American English"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
