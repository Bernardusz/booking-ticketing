info:
  name: Create a Movie
  type: http
  seq: 1

http:
  method: POST
  url: https://localhost:8443/api/v1/movies
  body:
    type: json
    data: |-
      {
        "title": "Ode to Joy",
        "description": "A musical film, about how humanity came together as one.",
        "releaseDate": "2010-07-16",
        "durationMinutes": "189"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
