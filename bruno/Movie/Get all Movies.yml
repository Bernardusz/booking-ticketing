info:
  name: Get all Movies
  type: http
  seq: 2

http:
  method: GET
  url: https://localhost:8443/api/v1/movies?minDuration=150&keywords=NASA
  params:
    - name: maxDuration
      value: "151"
      type: query
      disabled: true
    - name: minDuration
      value: "150"
      type: query
    - name: releasedAfter
      value: 2010-09-16
      type: query
      disabled: true
    - name: releasedBefore
      value: 2026-09-28
      type: query
      disabled: true
    - name: keywords
      value: NASA
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
