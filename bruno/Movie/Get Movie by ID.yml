info:
  name: Get Movie by ID
  type: http
  seq: 3

http:
  method: GET
  url: https://localhost:8443/api/v1/movies/:movieId
  params:
    - name: movieId
      value: "2"
      type: path
      description: The id of the movie you want to search
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
